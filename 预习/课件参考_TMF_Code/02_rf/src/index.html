<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <!-- 设置字符编码 -->
    <meta charset="UTF-8">

    <!-- 设置页面标题 -->
    <title>GET 和 POST 提交演示</title>
</head>

<body>

    <!-- ============================== -->
    <!-- 一、GET 请求演示 -->
    <!-- ============================== -->

    <h2>1. GET 提交数据</h2>

    <p>
        GET 提交后，数据会出现在浏览器地址栏的 URL 中。
    </p>

    <!--
        method="get"
        表示使用 GET 请求提交数据

        action
        表示数据提交到哪里
    -->
    <form
        action="https://httpbin.org/get"
        method="get"
    >

        <!-- 用户名 -->
        用户名：

        <input
            type="text"
            name="username"
        >

        <br><br>

        <!-- 密码 -->
        密码：

        <input
            type="text"
            name="password"
        >

        <br><br>

        <!-- 提交按钮 -->
        <button type="submit">
            GET 提交
        </button>

    </form>


    <hr>


    <!-- ============================== -->
    <!-- 二、POST 请求演示 -->
    <!-- ============================== -->

    <h2>2. POST 提交数据</h2>

    <p>
        POST 提交后，数据不会直接显示在浏览器地址栏中。
    </p>

    <!--
        method="post"
        表示使用 POST 请求提交数据
    -->
    <form
        action="https://httpbin.org/post"
        method="post"
    >

        <!-- 用户名 -->
        用户名：

        <input
            type="text"
            name="username"
        >

        <br><br>

        <!-- 密码 -->
        密码：

        <input
            type="text"
            name="password"
        >

        <br><br>

        <!-- 提交按钮 -->
        <button type="submit">
            POST 提交
        </button>

    </form>

</body>

</html>
